# ─────────────────────────────────────────────────────────────
#  Smarity — ayarlar
#  Bu dosyayı GitHub'da kalem simgesiyle düzenleyebilirsin.
#  Değişiklikler bir sonraki çalışmada (en geç ~10 dk) devreye girer.
# ─────────────────────────────────────────────────────────────

site:
  name: "Smarity"
  tagline: "Teknolojide yeni olan her şey, kaynağıyla."
  description: "Dünyadan ve Türkiye'den yeni ürünleri, girişim hikâyelerini, ilk kez denenen teknolojileri, yapay zeka, otomobil ve oyun dünyasını her haberde orijinal kaynağıyla aktaran Türkçe teknoloji haber sitesi."
  # Sitenin adresi (boş bırakırsan GitHub Pages adresi otomatik kullanılır)
  url: "https://smarity.com.tr"
  posts_per_page: 18
  contact_email: ""        # Hakkında sayfasında görünür (boş bırakılabilir)
  instagram: ""            # Instagram kullanıcı adı (boşsa bağlanan hesap kullanılır; site altında bağlantı çıkar)

seo:
  # Ana sayfanın büyük başlığı ve Google'da görünen başlığı ve açıklaması
  home_h1: "Teknoloji haberleri"
  home_title: "Teknoloji Haberleri: Yapay Zeka, İnovasyon, Girişimcilik, Gaming"
  home_description: "Dünyadan ve Türkiye'den yapay zeka, yeni teknoloji ürünleri, inovasyon, girişim hikâyeleri ve oyun dünyası haberleri. Kaynağıyla, Türkçe, her gün güncel."
  # Arama motoru doğrulama kodları (Search Console / Bing / Yandex'in verdiği "content" değeri)
  google_site_verification: "ChTcddRF_YOMXdFjpyGX4IbkbxC2lXSjJkQSMRd_Dqs"
  bing_site_verification: ""
  yandex_verification: ""
  # Yeni haberleri Bing ve Yandex'e anında bildir (ücretsiz, hesap gerekmez)
  indexnow: true
  featured_count: 5        # Ana sayfadaki kaydırmalı manşette kaç haber olsun

schedule:
  timezone: "Europe/Istanbul"
  collect_every_minutes: 15      # Kaynaklar kaç dakikada bir taransın
  daily_summary_hour: 21         # Günlük özet Telegram'a saat kaçta gelsin
  quiet_hours: [0, 8]            # Bu saatler arasında bildirimler sessiz gelir
  listen_seconds: 240            # Butonlara anında tepki için her turda Telegram'ı dinleme süresi (sn)

editorial:
  min_importance: 7              # 1-10 arası. Bunun altındaki haberler hiç önüne gelmez (seçici: 7)
  max_drafts_per_run: 2          # Bir taramada en fazla kaç yeni haber taslağı yazılsın (haberler tek tek, düzenli gelsin)
  max_drafts_per_day: 0          # Günlük üst sınır (0 = sınır yok; haberler yalnızca önem eşiğine göre seçilir)
  active_hours: [7, 24]          # Taslakların yayıldığı saatler (gece en fazla birkaç haber gelir, kalanlar sabaha kalır)
  max_item_age_hours: 36         # Bundan eski haberler atlanır
  pending_expire_hours: 36       # Onaylanmayan taslak bu süre sonunda düşer
  fetch_full_text: true          # Haberin tam metnini kaynağından okuyup daha doğru özet çıkar

autonomy:
  # manuel  : her haber onayına gelir
  # ogrenen : kararlarından öğrenir; güvendiği kaynaklardan gelen net haberleri kendisi yayınlar (önerilen)
  # tam     : sadece şüpheli/riskli haberleri sorar, gerisini kendisi yayınlar
  # Telegram'dan /mod komutuyla da değiştirebilirsin.
  mode: ogrenen
  source_min_decisions: 10       # Bir kaynağa güvenmek için gereken en az karar sayısı
  source_min_approval: 0.9       # ...ve o kaynaktaki onay oranı
  global_window: 30              # Genel başarı için bakılan son karar sayısı
  global_min_approval: 0.85      # Son kararlarda genel onay oranı bunun altındaysa otomatik yayın durur
  auto_min_importance: 7         # Otomatik yayın için en düşük önem puanı

images:
  # kapak: habere özel tipografik kapak (dev rakam / isim / manşet), ücretsiz (önerilen)
  # 3d   : renkli 3D şekiller
  style: kapak
  # Her habere yapay zeka ile özel görsel (Google "Nano Banana").
  # GEMINI_API_KEY yoksa ya da üretim başarısız olursa tipografik kapak kullanılır.
  ai: false                              # ücretli (Google ödeme gerektirir). Açmak için: true
  model: "gemini-3.1-flash-lite-image"   # daha kaliteli: "gemini-3.1-flash-image"
  cost_per_image: 0.035                  # sadece maliyet raporu için (dolar)

social:
  # ── Instagram'a otomatik paylaşım ──
  # GitHub'da IG_ACCESS_TOKEN gizli anahtarı tanımlıysa yayınlanan her haber, site güncellendikten
  # birkaç dakika sonra carousel (3 görsel) ve hikâye olarak paylaşılır. Telegram'dan /instagram ile yönetilir.
  instagram_auto: true
  instagram_story: true            # carousel'e ek olarak hikâye de paylaşılsın
  instagram_hours: [8, 24]         # paylaşım saatleri; gece yayınlanan haberler sabah 8'de sırayla paylaşılır
  instagram_min_gap_minutes: 15    # iki paylaşım arasında en az bu kadar dakika olsun (akış boğulmasın)
  instagram_max_per_day: 0         # günlük üst sınır (0 = sınır yok; Instagram'ın kendi sınırı 100)
  instagram_max_wait_hours: 12     # bundan uzun sırada bekleyen haber artık paylaşılmaz (bayatlamasın)
  # IG_ACCESS_TOKEN yokken: Instagram post + story görsellerini elle paylaşman için Telegram'a gönder
  send_to_telegram: true
  # Instagram görsel tarzı:
  # ozet  : logo, kategori etiketi, vurgulu büyük başlık ve kısa özet; renkler habere göre değişir (önerilen)
  # kapak : dev rakam / ürün adı kapağı (sitedeki kapakla aynı)
  card_style: ozet

ai:
  # gemini: Google Gemini ücretsiz katmanı (kredi kartı gerekmez, günlük sınırlı)
  # claude: Anthropic Claude (ücretli, ANTHROPIC_API_KEY gerekir)
  provider: gemini
  triage_model: "gemini-flash-lite-latest"   # ayıklama
  writer_model: "gemini-flash-latest"        # haber yazımı
  # Claude'a geçersen örnek: triage_model "claude-haiku-4-5-20251001", writer_model "claude-sonnet-5"
  writer_effort: "medium"                    # sadece Claude için

